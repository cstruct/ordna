[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dev-dependencies]
# Needed by `#[config(path = ...)]`, see the `config` macro docs.
facet = "0.46.5"
ordna-core = { path = "../core" }
ordna-source-env = { path = "../source-env" }
ordna-source-file = { path = "../source-file" }
ordna-source-json = { path = "../source-json" }
ordna-source-styx = { path = "../source-styx" }
ordna-source-toml = { path = "../source-toml" }
ordna-source-yaml = { path = "../source-yaml" }
trybuild = "1.0.122"

[lints.clippy]
# Loading config fails with ordna's ConfigLoadError, which is large, but only once, at startup.
result_large_err = "allow"
