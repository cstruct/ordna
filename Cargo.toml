[workspace]
members = [
    "crates/core",
    "crates/integration-tests",
    "crates/macros",
    "crates/source-env",
    "crates/source-file",
    "crates/source-json",
    "crates/source-styx",
    "crates/source-toml",
    "crates/source-yaml",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/cstruct/ordna"
authors = ["Albin Skott"]
keywords = ["config", "configuration", "settings", "env"]
categories = ["config"]
